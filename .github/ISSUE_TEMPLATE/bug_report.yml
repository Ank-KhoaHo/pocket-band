name: Bug report
description: Something pocket-band does is wrong, or fails where it should not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Please do not report a security issue here.** Use our
        [security policy](https://github.com/Ank-KhoaHo/pocket-band/security/policy)
        instead — a public issue discloses it to everyone at once, before there is a fix to
        give them.

  - type: input
    id: version
    attributes:
      label: Version
      description: The release, commit or tag you are on.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: The smallest reproduction you can manage
      description: >
        What you ran or did, and any input it needs. A reproduction is worth more than a
        description of one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
